<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDVIEW</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.7) 20%, #7bb3f0 60%, #4a90e2 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 430px;
            width: 100%;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 40px 0 30px;
        }

        .logo {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.2));
            margin-bottom: 15px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 10px;
        }

        .function-grid {
            display: block;
            margin-bottom: 20px;
        }

        .function-card {
            width: 100%;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
            border: none;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .function-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(103, 126, 234, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s ease;
            opacity: 0;
        }

        .function-card:hover::before {
            opacity: 1;
            animation: shimmer 1.5s ease;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .function-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(76, 175, 80, 0.4);
        }

        .function-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .card-icon {
            width: 50px;
            height: 50px;
            margin: 0 auto 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
        }

        .price-card .card-icon {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .upload-card .card-icon {
            background: linear-gradient(135deg, #2196F3, #1976D2);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: white;
            margin: 0;
        }

        .card-description {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.4;
            margin: 0;
        }

        .play-section {
            margin-top: 20px;
            padding: 20px 0 40px;
        }

        .play-button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #4a90e2, #7bb3f0);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(74, 144, 226, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }

        .play-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .play-button:hover::before {
            left: 100%;
        }

        .play-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(74, 144, 226, 0.4);
        }

        .play-button:active {
            transform: translateY(-1px);
        }

        .play-icon {
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4a90e2;
            font-size: 12px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 35px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.3s ease;
        }

        .modal.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        .modal-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .modal-header h2 {
            color: #333;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #555;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            transition: all 0.3s ease;
            outline: none;
            background: #fafafa;
        }

        .form-group input:focus {
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-cancel {
            background: #f5f5f5;
            color: #666;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .btn-save {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .currency-prefix {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
            pointer-events: none;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            padding-left: 45px;
        }

        .success-message {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.3);
            display: none;
            z-index: 2000;
            font-weight: 500;
        }

        .success-message.show {
            display: block;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 380px) {
            .logo {
                width: 140px;
            }
            
            .function-grid {
                gap: 12px;
            }

            .function-card {
                padding: 20px 15px;
            }

            .modal-content {
                padding: 30px 25px;
            }
        }

        @media (orientation: landscape) and (max-height: 600px) {
            .header {
                padding: 20px 0 15px;
            }
            
            .play-section {
                padding: 15px 0 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="img/LOGO_PDVIEW.png" alt="PDVIEW" class="logo">
        </div>
        
        <div class="main-content">
            <div class="function-grid">
                <button class="function-card price-card" onclick="abrirModalPreco()">
                    <div class="card-title">Trocar Preço</div>
                    <div class="card-description">Atualizar valores de combustível</div>
                </button>
            </div>
            
            <div class="play-section">
                <button class="play-button" onclick="window.location.href='play.html'">
                    <div class="play-icon">▶</div>
                    Reproduzir Conteúdo
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Trocar Preço -->
    <div id="modalPreco" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Atualizar Preços</h2>
                <div class="modal-subtitle">Configure os valores dos combustíveis</div>
            </div>
            
            <div class="form-group">
                <label for="etanol">Etanol</label>
                <div class="input-wrapper">
                    <span class="currency-prefix">R$</span>
                    <input type="text" id="etanol" placeholder="0,00" 
                           oninput="formatarValor(this)" 
                           onkeypress="return apenasNumeros(event)">
                </div>
            </div>
            
            <div class="form-group">
                <label for="gasolina">Gasolina Comum</label>
                <div class="input-wrapper">
                    <span class="currency-prefix">R$</span>
                    <input type="text" id="gasolina" placeholder="0,00" 
                           oninput="formatarValor(this)" 
                           onkeypress="return apenasNumeros(event)">
                </div>
            </div>
            
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarPrecos()">Salvar</button>
            </div>
        </div>
    </div>

    <div id="successMessage" class="success-message">
        ✓ Preços salvos com sucesso!
    </div>

    <script>
        function abrirModalPreco() {
            document.getElementById('modalPreco').classList.add('active');
            document.getElementById('etanol').value = '';
            document.getElementById('gasolina').value = '';
        }

        function fecharModal() {
            document.getElementById('modalPreco').classList.remove('active');
        }

        function apenasNumeros(event) {
            const char = String.fromCharCode(event.which);
            if (!char.match(/[0-9,]/)) {
                event.preventDefault();
                return false;
            }
            return true;
        }

        function formatarValor(input) {
            let valor = input.value.replace(/\D/g, '');
            valor = (valor / 100).toFixed(2);
            valor = valor.replace('.', ',');
            input.value = valor;
        }

        async function salvarPrecos() {
            const etanol = document.getElementById('etanol').value.replace(',', '.');
            const gasolina = document.getElementById('gasolina').value.replace(',', '.');
            
            if (!etanol || !gasolina) {
                alert('Por favor, preencha todos os campos');
                return;
            }

            try {
                // Usa o mesmo host de onde a página foi carregada
                const nodeServerUrl = `http://${window.location.hostname}:3000/save-price`;
                const response = await fetch(nodeServerUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        etanol: etanol,
                        gasolina: gasolina
                    })
                });

                const result = await response.json();
                
                if (result.success) {
                    fecharModal();
                    mostrarMensagemSucesso();
                } else {
                    alert('Erro ao salvar preços: ' + result.message);
                }
            } catch (error) {
                alert('Erro ao salvar preços. Verifique se o servidor Node.js está rodando na porta 3000.');
            }
        }

        function mostrarMensagemSucesso() {
            const msg = document.getElementById('successMessage');
            msg.classList.add('show');
            setTimeout(() => {
                msg.classList.remove('show');
            }, 3000);
        }


        // Fechar modal ao clicar fora
        document.getElementById('modalPreco').addEventListener('click', function(e) {
            if (e.target === this) {
                fecharModal();
            }
        });

        // Animação de entrada dos cards
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.function-card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    card.style.transition = 'all 0.6s ease';
                    setTimeout(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    }, 100);
                }, index * 150);
            });
        });
    </script>
</body>
</html>
