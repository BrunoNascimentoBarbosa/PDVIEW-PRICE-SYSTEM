<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=192, height=384, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDVIEW - Painel LED</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 192px;
            height: 384px;
            background: #000;
            overflow: hidden;
            position: fixed;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            position: relative;
            width: 192px;
            height: 384px;
        }

        #mainVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 192px;
            height: 384px;
            object-fit: cover;
            /* Preenche mantendo proporção */
            background: #000;
        }

        .price-display {
            position: absolute;
            top: 0;
            left: 0;
            width: 192px;
            height: 384px;
            z-index: 10;
            pointer-events: none;
        }

        .price-value {
            position: absolute;
            font-size: 26px;
            font-weight: bold;
            color: #FF0000;
            /* VERMELHO */
            text-shadow:
                -2px -2px 3px #000,
                2px -2px 3px #000,
                -2px 2px 3px #000,
                2px 2px 3px #000,
                0 0 5px #000;
            font-family: 'Arial Black', Arial, sans-serif;
            width: 70px;
            height: 28px;
            text-align: center;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: -0.5px;
        }

        /* Posições mais acima na tela */
        .etanol-price {
            top: 10px;
            margin-left: 40px;
            /* Subiu 25px */
        }

        .gasolina-price {
            top: 55px;
            margin-left: 40px;
            /* Subiu 25px */
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFF;
            font-size: 12px;
        }


        /* Remove controles do vídeo */
        video::-webkit-media-controls {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <video id="mainVideo" autoplay loop muted playsinline webkit-playsinline>
            <source src="Videos/video-base-580x1080-sem-valor.mp4" type="video/mp4">
        </video>

        <div id="priceDisplay" class="price-display">
            <div class="loading">Carregando...</div>
        </div>
    </div>

    <script>
        // Configurações otimizadas para painel LED
        const CONFIG = {
            priceUpdateInterval: 30000,   // 30 segundos
            heartbeatInterval: 15000,     // 15 segundos
            reloadPageTimeout: 120000     // 2 minutos
        };

        let isOnline = true;
        let reloadTimer = null;

        const video = document.getElementById('mainVideo');
        const priceDisplay = document.getElementById('priceDisplay');

        // Desabilitar controles
        video.controls = false;

        function formatPrice(value) {
            return value.toFixed(2).replace('.', ',');
        }

        function updateConnectionStatus(online) {
            // Removido - não há mais indicador visual
        }

        async function loadPrices() {
            try {
                // API de preços roda na porta 3000 (Node.js)
                const baseUrl = window.location.hostname === 'localhost' ||
                    window.location.hostname === '127.0.0.1'
                    ? 'http://localhost:3000'
                    : `http://${window.location.hostname}:3000`;

                const response = await fetch(baseUrl + '/get-price', {
                    cache: 'no-cache',
                    mode: 'cors'
                });

                if (response.ok) {
                    const data = await response.json();

                    priceDisplay.innerHTML = `
                        <div class="price-value etanol-price"><span>${formatPrice(data.etanol)}</span></div>
                        <div class="price-value gasolina-price"><span>${formatPrice(data.gasolina)}</span></div>
                    `;

                    if (!isOnline) {
                        console.log('Servidor reconectado');
                        handleReconnection();
                    }
                    isOnline = true;
                    updateConnectionStatus(true);

                } else {
                    throw new Error('Erro na resposta');
                }
            } catch (error) {
                console.error('Erro ao carregar preços:', error);
                console.error('Verifique se o servidor Node.js está rodando na porta 3000');

                // Mostra erro na tela para debug
                if (priceDisplay.innerHTML.includes('Carregando')) {
                    priceDisplay.innerHTML = `
                        <div class="loading">Erro: Servidor offline<br>Porta 3000</div>
                    `;
                }

                if (isOnline) {
                    console.log('Servidor desconectado');
                    handleDisconnection();
                }
                isOnline = false;
                updateConnectionStatus(false);
            }
        }

        function handleDisconnection() {
            updateConnectionStatus(false);

            if (!reloadTimer) {
                reloadTimer = setTimeout(() => {
                    console.log('Recarregando página...');
                    window.location.reload(true);
                }, CONFIG.reloadPageTimeout);
            }

            ensureVideoPlaying();
        }

        function handleReconnection() {
            updateConnectionStatus(true);

            if (reloadTimer) {
                clearTimeout(reloadTimer);
                reloadTimer = null;
            }

            // Apenas verifica o vídeo, não recarrega a página
            ensureVideoPlaying();
        }

        function ensureVideoPlaying() {
            if (video.paused || video.ended) {
                video.play().catch(e => {
                    console.log('Tentando reproduzir novamente...');
                    setTimeout(ensureVideoPlaying, 2000);
                });
            }
        }

        function setupVideo() {
            // Configurações para garantir reprodução contínua
            video.addEventListener('ended', () => {
                video.currentTime = 0;
                video.play();
            });

            video.addEventListener('pause', () => {
                setTimeout(() => {
                    if (video.paused) {
                        video.play();
                    }
                }, 100);
            });

            video.addEventListener('error', (e) => {
                console.error('Erro no vídeo:', e);
                setTimeout(() => {
                    video.load();
                    video.play();
                }, 5000);
            });

            // Forçar play inicial
            video.play().catch(() => {
                console.log('Autoplay bloqueado');
                // Tentar novamente após interação
                document.addEventListener('click', () => {
                    video.play();
                }, { once: true });
            });
        }

        async function heartbeat() {
            try {
                const baseUrl = window.location.hostname === 'localhost' ||
                    window.location.hostname === '127.0.0.1'
                    ? 'http://localhost:8000'
                    : `http://${window.location.hostname}:8000`;

                const response = await fetch(baseUrl + '/', {
                    method: 'HEAD',
                    mode: 'no-cors'
                });

                if (!isOnline) {
                    handleReconnection();
                    isOnline = true;
                }
            } catch (error) {
                if (isOnline) {
                    handleDisconnection();
                    isOnline = false;
                }
            }
        }

        // Prevenir zoom e scroll em telas touch
        document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
        document.addEventListener('gesturestart', e => e.preventDefault());
        document.addEventListener('gesturechange', e => e.preventDefault());
        document.addEventListener('wheel', e => e.preventDefault(), { passive: false });

        // Detectar visibilidade da página
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                loadPrices();
                ensureVideoPlaying();
            }
        });

        // Função de debug para ajustar posições (usar no console F12)
        window.adjustPrices = function (etanolTop, gasolinaTop) {
            const etanol = document.querySelector('.etanol-price');
            const gasolina = document.querySelector('.gasolina-price');
            if (etanol) etanol.style.top = etanolTop + 'px';
            if (gasolina) gasolina.style.top = gasolinaTop + 'px';
            console.log(`Ajustado - Etanol: ${etanolTop}px, Gasolina: ${gasolinaTop}px`);
            console.log('Para manter essas posições, atualize o CSS com estes valores.');
        };

        // Inicialização
        function init() {
            console.log('PDVIEW LED 192x384 - Iniciando...');
            console.log('Para ajustar posições use: adjustPrices(145, 245)');

            setupVideo();
            loadPrices();

            // Intervalos periódicos
            setInterval(loadPrices, CONFIG.priceUpdateInterval);
            setInterval(heartbeat, CONFIG.heartbeatInterval);

            // Garantir vídeo tocando
            setInterval(ensureVideoPlaying, 5000);
        }

        // Iniciar
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>

</html>
